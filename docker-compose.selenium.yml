version: '3.8'

services:
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: gamemanager-selenium
    ports:
      - "4444:4444"
      - "7900:7900"  # VNC port for debugging (optional)
    environment:
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    volumes:
      - /dev/shm:/dev/shm
    shm_size: 2gb
    restart: unless-stopped
    networks:
      - gamemanager-network

  # Optional: Selenium Grid Hub (for scaling)
  selenium-hub:
    image: selenium/hub:latest
    container_name: gamemanager-selenium-hub
    ports:
      - "4442:4442"
    environment:
      - GRID_MAX_SESSION=4
      - GRID_BROWSER_TIMEOUT=300
      - GRID_TIMEOUT=300
    restart: unless-stopped
    networks:
      - gamemanager-network

  # Optional: Additional Chrome nodes
  selenium-chrome:
    image: selenium/node-chrome:latest
    container_name: gamemanager-selenium-chrome
    depends_on:
      - selenium-hub
    environment:
      - HUB_HOST=selenium-hub
      - HUB_PORT=4442
      - NODE_MAX_INSTANCES=2
      - NODE_MAX_SESSION=2
    volumes:
      - /dev/shm:/dev/shm
    shm_size: 2gb
    restart: unless-stopped
    networks:
      - gamemanager-network

networks:
  gamemanager-network:
    driver: bridge

