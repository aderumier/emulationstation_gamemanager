<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cropper.js v2 Simple Test (Fixed)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #333;
            color: #fff;
        }
        /* Hide file input */
        #imageLoader {
            display: none;
        }
        
        cropper-canvas {
            width: 600px;
            height: 900px;
            border: 2px solid #fff;
            display: block;
            margin: 0 auto;
            background: #000;
        }
        
        .cropper-container {
            border: 1px solid #666;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            margin-top: 1rem;
            padding: 1.25rem 1.5rem;
        }
    </style>
    
    <!-- Load Cropper.js v2.0 Element Packages (UMD) -->
    <script src="https://cdn.jsdelivr.net/npm/@cropper/element-canvas@2.1.0/dist/element-canvas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@cropper/element-image@2.1.0/dist/element-image.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@cropper/element-shade@2.1.0/dist/element-shade.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@cropper/element-handle@2.1.0/dist/element-handle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@cropper/element-selection@2.1.0/dist/element-selection.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@cropper/element-grid@2.1.0/dist/element-grid.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@cropper/element-crosshair@2.1.0/dist/element-crosshair.js"></script>
    
    <script>
        // Explicitly register the custom elements using the global classes
        try {
            customElements.define('cropper-canvas', CropperCanvas);
            customElements.define('cropper-image', CropperImage);
            customElements.define('cropper-shade', CropperShade);
            customElements.define('cropper-handle', CropperHandle);
            customElements.define('cropper-selection', CropperSelection);
            customElements.define('cropper-grid', CropperGrid);
            customElements.define('cropper-crosshair', CropperCrosshair);
            console.log('Cropper.js elements registered successfully');
        } catch (err) {
            console.error('Error registering elements:', err);
        }
    </script>
</head>
<body>
    <h1 style="text-align: center;">Cropper.js v2 Test</h1>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <input type="file" id="imageLoader" accept="image/*">
        <label for="imageLoader" style="cursor: pointer; background: #007bff; padding: 10px 20px; color: white; border-radius: 5px;">Choose Image</label>
    </div>
    
    <div class="cropper-container">
        <cropper-canvas id="cropperCanvas" background>
            <cropper-image id="cropperImage" src="/api/template-image?path=testtemplate_background.jpg&type=background" imageFit="contain" rotatable scalable skewable translatable></cropper-image>
            <cropper-shade hidden></cropper-shade>
            <cropper-handle action="select" plain></cropper-handle>
            <cropper-selection id="cropperSelection" initial-coverage="0.5" movable resizable outlined>
                <cropper-grid role="grid" bordered covered></cropper-grid>
                <cropper-crosshair centered></cropper-crosshair>
                <cropper-handle action="move" theme-color="rgba(255, 255, 255, 0.35)"></cropper-handle>
                <cropper-handle action="n-resize"></cropper-handle>
                <cropper-handle action="e-resize"></cropper-handle>
                <cropper-handle action="s-resize"></cropper-handle>
                <cropper-handle action="w-resize"></cropper-handle>
                <cropper-handle action="ne-resize"></cropper-handle>
                <cropper-handle action="nw-resize"></cropper-handle>
                <cropper-handle action="se-resize"></cropper-handle>
                <cropper-handle action="sw-resize"></cropper-handle>
            </cropper-selection>
        </cropper-canvas>
    </div>
    
    <script>
        const image = document.getElementById('cropperImage');
        const imageLoader = document.getElementById('imageLoader');
        const cropperCanvas = document.getElementById('cropperCanvas');
        const cropperSelection = document.getElementById('cropperSelection');
        
        // Helper function to check if selection is within bounds
        function inSelection(selection, maxSelection) {
            return (
                selection.x >= maxSelection.x &&
                selection.y >= maxSelection.y &&
                (selection.x + selection.width) <= (maxSelection.x + maxSelection.width) &&
                (selection.y + selection.height) <= (maxSelection.y + maxSelection.height)
            );
        }
        
        // Handle image transform event (for when image is rotated/scaled)
        function onCropperImageTransform(event) {
            if (!cropperCanvas) {
                return;
            }
            
            const cropperCanvasRect = cropperCanvas.getBoundingClientRect();
            
            // 1. Clone the cropper image
            const cropperImageClone = image.cloneNode();
            
            // 2. Apply the new matrix to the cropper image clone
            cropperImageClone.style.transform = `matrix(${event.detail.matrix.join(', ')})`;
            
            // 3. Make the cropper image clone invisible
            cropperImageClone.style.opacity = '0';
            
            // 4. Append the cropper image clone to the cropper canvas
            cropperCanvas.appendChild(cropperImageClone);
            
            // 5. Compute the boundaries of the cropper image clone
            const cropperImageRect = cropperImageClone.getBoundingClientRect();
            
            // 6. Remove the cropper image clone
            cropperCanvas.removeChild(cropperImageClone);
            
            const selection = cropperSelection;
            const maxSelection = {
                x: cropperImageRect.left - cropperCanvasRect.left,
                y: cropperImageRect.top - cropperCanvasRect.top,
                width: cropperImageRect.width,
                height: cropperImageRect.height,
            };
            
            if (!inSelection(selection, maxSelection)) {
                event.preventDefault();
            }
        }
        
        // Handle selection change event - limit to image boundaries only
        function onCropperSelectionChange(event) {
            if (!cropperCanvas) {
                return;
            }
            
            const cropperCanvasRect = cropperCanvas.getBoundingClientRect();
            const selection = event.detail;
            
            // Limit to image boundaries
            const cropperImageRect = image.getBoundingClientRect();
            const maxSelection = {
                x: cropperImageRect.left - cropperCanvasRect.left,
                y: cropperImageRect.top - cropperCanvasRect.top,
                width: cropperImageRect.width,
                height: cropperImageRect.height,
            };
            
            if (!inSelection(selection, maxSelection)) {
                event.preventDefault();
            }
        }
        
        // Set up event listeners
        image.addEventListener('transform', onCropperImageTransform);
        cropperSelection.addEventListener('change', onCropperSelectionChange);
        
        // Initialize image
        image.$ready().then(() => {
            console.log('Image loaded via $ready');
            image.$center('contain');
        }).catch(err => {
            console.error('Image load failed:', err);
        });
        
        // Handle image file upload
        imageLoader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    // Reset image transform before loading new image
                    image.style.transform = '';
                    
                    // Set new image source
                    image.src = event.target.result;
                    
                    // Wait for image to load and then center it
                    image.$ready().then(() => {
                        console.log('New image loaded via $ready');
                        // Reset transform and center
                        image.style.transform = '';
                        image.$center('contain');
                        
                        // Reset selection to initial coverage
                        if (cropperSelection && cropperSelection.$initSelection) {
                            cropperSelection.$initSelection(true, true);
                        }
                    }).catch(err => {
                        console.error('New image load failed:', err);
                    });
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
