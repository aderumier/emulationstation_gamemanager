name: Build Windows Executable

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
    branches:
      - main
      - master
    paths:
      - 'app.py'
      - 'gamemanager.spec'
      - '.github/workflows/build-windows.yml'
      - 'requirements.txt'
      - 'var/db/igdb/igdb_db.pkl.gz'
      - 'var/cache/steam_partitioned_index.pkl'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false  # Don't checkout submodules (google-images-scraper not needed)
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Download FFmpeg
      run: |
        $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        $ffmpegZip = "$env:TEMP\ffmpeg.zip"
        Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip
        Expand-Archive -Path $ffmpegZip -DestinationPath "$env:TEMP\ffmpeg" -Force
        $ffmpegDir = Get-ChildItem "$env:TEMP\ffmpeg" -Directory | Select-Object -First 1
        New-Item -ItemType Directory -Path "tools\windows\ffmpeg" -Force | Out-Null
        Copy-Item "$ffmpegDir\bin\ffmpeg.exe" "tools\windows\ffmpeg\ffmpeg.exe"
        Copy-Item "$ffmpegDir\bin\ffprobe.exe" "tools\windows\ffmpeg\ffprobe.exe"
        Write-Host "FFmpeg downloaded and extracted"
        
    - name: Download ImageMagick
      run: |
        $imagemagickUrl = "https://imagemagick.org/archive/binaries/ImageMagick-7.1.1-15-Q16-HDRI-x64-dll.exe"
        $imagemagickInstaller = "$env:TEMP\imagemagick.exe"
        # Try to download portable version first, fallback to installer
        try {
          $portableUrl = "https://imagemagick.org/archive/binaries/ImageMagick-7.1.1-15-Q16-HDRI-x64.zip"
          Invoke-WebRequest -Uri $portableUrl -OutFile "$env:TEMP\imagemagick.zip" -ErrorAction Stop
          Expand-Archive -Path "$env:TEMP\imagemagick.zip" -DestinationPath "$env:TEMP\imagemagick" -Force
          $imDir = Get-ChildItem "$env:TEMP\imagemagick" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path "tools\windows\imagemagick" -Force | Out-Null
          Copy-Item "$imDir\ImageMagick-*\bin\convert.exe" "tools\windows\imagemagick\convert.exe" -ErrorAction SilentlyContinue
          Copy-Item "$imDir\ImageMagick-*\bin\identify.exe" "tools\windows\imagemagick\identify.exe" -ErrorAction SilentlyContinue
          # Try alternative path structure
          if (-not (Test-Path "tools\windows\imagemagick\convert.exe")) {
            $binDir = Get-ChildItem "$env:TEMP\imagemagick" -Recurse -Filter "convert.exe" | Select-Object -First 1
            if ($binDir) {
              Copy-Item $binDir.FullName "tools\windows\imagemagick\convert.exe"
              Copy-Item $binDir.DirectoryName\identify.exe "tools\windows\imagemagick\identify.exe"
            }
          }
        } catch {
          Write-Host "Portable version not available, will need manual ImageMagick setup"
          New-Item -ItemType Directory -Path "tools\windows\imagemagick" -Force | Out-Null
        }
        Write-Host "ImageMagick setup completed"
        
    - name: Download yt-dlp
      run: |
        $ytdlpUrl = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
        New-Item -ItemType Directory -Path "tools\windows" -Force | Out-Null
        Invoke-WebRequest -Uri $ytdlpUrl -OutFile "tools\windows\yt-dlp.exe"
        Write-Host "yt-dlp downloaded"
    
    - name: Decompress IGDB database (igdb_db.pkl.gz -> igdb_db.pkl)
      run: |
        if (Test-Path "var\db\igdb\igdb_db.pkl.gz") {
          python -c "import gzip; p='var/db/igdb/igdb_db.pkl'; f=gzip.open('var/db/igdb/igdb_db.pkl.gz','rb'); open(p,'wb').write(f.read()); f.close()"
          Write-Host "Decompressed igdb_db.pkl.gz -> igdb_db.pkl"
        } else {
          Write-Host "No igdb_db.pkl.gz found, skipping"
        }
        
    - name: Build executable with PyInstaller
      run: |
        pyinstaller --clean gamemanager.spec
        if ($LASTEXITCODE -ne 0) {
          Write-Host "PyInstaller build failed"
          exit 1
        }
        
    - name: Create distribution folder
      run: |
        New-Item -ItemType Directory -Path "dist\gamemanager_windows" -Force | Out-Null
        # Copy executable
        Copy-Item "dist\gamemanager.exe" "dist\gamemanager_windows\gamemanager.exe"
        # Copy _internal folder (PyInstaller files)
        if (Test-Path "dist\_internal") {
          Copy-Item -Path "dist\_internal" -Destination "dist\gamemanager_windows\_internal" -Recurse -Force
        }
        # Copy only Windows tools (not the scraper tools)
        if (Test-Path "tools\windows") {
          New-Item -ItemType Directory -Path "dist\gamemanager_windows\tools\windows" -Force | Out-Null
          Copy-Item -Path "tools\windows\*" -Destination "dist\gamemanager_windows\tools\windows" -Recurse -Force
        }
        # Create var directory structure
        New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\config" -Force | Out-Null
        New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\db" -Force | Out-Null
        New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\cache" -Force | Out-Null
        New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\task_logs" -Force | Out-Null
        
        # Copy var/config files (like in .deb package)
        Write-Host "Copying var/config files..."
        if (Test-Path "var\config") {
          Copy-Item -Path "var\config\config.json" -Destination "dist\gamemanager_windows\var\config\" -ErrorAction SilentlyContinue
          Copy-Item -Path "var\config\scrappers.json" -Destination "dist\gamemanager_windows\var\config\" -ErrorAction SilentlyContinue
          Copy-Item -Path "var\config\systems.json" -Destination "dist\gamemanager_windows\var\config\" -ErrorAction SilentlyContinue
          Copy-Item -Path "var\config\scrapper_genre_mapping.json" -Destination "dist\gamemanager_windows\var\config\" -ErrorAction SilentlyContinue
          Copy-Item -Path "var\config\genres.json" -Destination "dist\gamemanager_windows\var\config\" -ErrorAction SilentlyContinue
          Write-Host "  Copied config files"
          
          # Update config.json for Windows (set roms_root_directory for Retrobat)
          $configPath = "dist\gamemanager_windows\var\config\config.json"
          if (Test-Path $configPath) {
            $configContent = Get-Content $configPath -Raw -Encoding UTF8
            $configContent = $configContent -replace '"roms_root_directory":\s*"[^"]*"', '"roms_root_directory": "R:\\\\retrobat\\\\roms\\\\"'
            $configContent | Set-Content $configPath -Encoding UTF8 -NoNewline
            Write-Host "  Updated config.json for Windows (roms_root_directory)"
          }
        }
        
        # Copy var/cache (Steam partitioned index)
        Write-Host "Copying var/cache files..."
        if (Test-Path "var\cache\steam_partitioned_index.pkl") {
          Copy-Item -Path "var\cache\steam_partitioned_index.pkl" -Destination "dist\gamemanager_windows\var\cache\" -ErrorAction SilentlyContinue
          Write-Host "  Copied steam_partitioned_index.pkl"
        }
        
        # Copy var/fonts files (like in .deb package)
        Write-Host "Copying var/fonts files..."
        if (Test-Path "var\fonts") {
          New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\fonts" -Force | Out-Null
          Copy-Item -Path "var\fonts\*" -Destination "dist\gamemanager_windows\var\fonts\" -ErrorAction SilentlyContinue
          Write-Host "  Copied font files"
        }
        
        # Copy var/2dbox/templates files (like in .deb package)
        Write-Host "Copying var/2dbox/templates files..."
        if (Test-Path "var\2dbox\templates") {
          New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\2dbox\templates" -Force | Out-Null
          Copy-Item -Path "var\2dbox\templates\*" -Destination "dist\gamemanager_windows\var\2dbox\templates\" -ErrorAction SilentlyContinue
          Write-Host "  Copied 2D box templates"
        }
        
        # Copy var/3dbox/templates files (like in .deb package)
        Write-Host "Copying var/3dbox/templates files..."
        if (Test-Path "var\3dbox\templates") {
          New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\3dbox\templates" -Force | Out-Null
          Copy-Item -Path "var\3dbox\templates\*" -Destination "dist\gamemanager_windows\var\3dbox\templates\" -ErrorAction SilentlyContinue
          Write-Host "  Copied 3D box templates"
        }
        
        # Copy var/db files (like in .deb package)
        Write-Host "Copying var/db files..."
        
        # MobyGames databases
        if (Test-Path "var\db\mobygames") {
          New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\db\mobygames" -Force | Out-Null
          Copy-Item -Path "var\db\mobygames\*.json" -Destination "dist\gamemanager_windows\var\db\mobygames\" -ErrorAction SilentlyContinue
          Write-Host "  Copied MobyGames databases"
        }
        
        # IGDB databases
        if (Test-Path "var\db\igdb") {
          New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\db\igdb" -Force | Out-Null
          Copy-Item -Path "var\db\igdb\*.pkl" -Destination "dist\gamemanager_windows\var\db\igdb\" -ErrorAction SilentlyContinue
          Copy-Item -Path "var\db\igdb\*.json" -Destination "dist\gamemanager_windows\var\db\igdb\" -ErrorAction SilentlyContinue
          Copy-Item -Path "var\db\igdb\mediatype.txt" -Destination "dist\gamemanager_windows\var\db\igdb\" -ErrorAction SilentlyContinue
          Write-Host "  Copied IGDB databases"
        }
        
        # EmuMovies databases
        if (Test-Path "var\db\emumovies") {
          New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\db\emumovies" -Force | Out-Null
          Copy-Item -Path "var\db\emumovies\emumovies.json" -Destination "dist\gamemanager_windows\var\db\emumovies\" -ErrorAction SilentlyContinue
          Copy-Item -Path "var\db\emumovies\emumovies_index.pkl" -Destination "dist\gamemanager_windows\var\db\emumovies\" -ErrorAction SilentlyContinue
          Write-Host "  Copied EmuMovies databases"
        }
        
        # Custom databases
        if (Test-Path "var\db\custom") {
          New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\db\custom" -Force | Out-Null
          Copy-Item -Path "var\db\custom\*.json" -Destination "dist\gamemanager_windows\var\db\custom\" -ErrorAction SilentlyContinue
          Write-Host "  Copied Custom databases"
        }
        
        # Platform cache files
        if (Test-Path "var\db\screenscraper") {
          New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\db\screenscraper" -Force | Out-Null
          Copy-Item -Path "var\db\screenscraper\platforms.json" -Destination "dist\gamemanager_windows\var\db\screenscraper\" -ErrorAction SilentlyContinue
          Write-Host "  Copied ScreenScraper platform cache"
        }
        
        # Create empty files for cache files that will be populated by the application
        if (Test-Path "dist\gamemanager_windows\var\db\igdb") {
          $emptyFiles = @("companies.json", "genres.json", "regions_cache.json", "sample_games.json")
          foreach ($file in $emptyFiles) {
            if (-not (Test-Path "dist\gamemanager_windows\var\db\igdb\$file")) {
              New-Item -ItemType File -Path "dist\gamemanager_windows\var\db\igdb\$file" -Force | Out-Null
            }
          }
        }
        
        if (Test-Path "dist\gamemanager_windows\var\db\steam") {
          New-Item -ItemType Directory -Path "dist\gamemanager_windows\var\db\steam" -Force | Out-Null
          if (-not (Test-Path "dist\gamemanager_windows\var\db\steam\appindex.json")) {
            New-Item -ItemType File -Path "dist\gamemanager_windows\var\db\steam\appindex.json" -Force | Out-Null
          }
        }
        
        Write-Host "Distribution folder created"
        
    - name: Create README for Windows
      run: |
        if (Test-Path "README_WINDOWS.md") {
          Copy-Item "README_WINDOWS.md" "dist\gamemanager_windows\README_WINDOWS.txt"
        } else {
          # Fallback: create minimal README if file doesn't exist
          $content = "# GameManager for Windows`n`nThis is a standalone Windows executable of GameManager.`n`n## Installation`n`n1. Extract the zip file to a location of your choice`n2. Run gamemanager.exe`n3. Open your browser and navigate to http://localhost:5000`n"
          $content | Out-File -FilePath "dist\gamemanager_windows\README_WINDOWS.txt" -Encoding UTF8
        }
        
    - name: Create zip archive
      run: |
        $version = if ($env:GITHUB_REF -like "refs/tags/*") {
          $env:GITHUB_REF -replace "refs/tags/v", ""
        } else {
          $env:GITHUB_SHA.Substring(0, 7)
        }
        $zipName = "gamemanager-windows-$version.zip"
        Compress-Archive -Path "dist\gamemanager_windows\*" -DestinationPath $zipName -Force
        Write-Host "Created archive: $zipName"
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamemanager-windows
        path: ${{ env.ZIP_NAME }}
        retention-days: 30
        
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.ZIP_NAME }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
