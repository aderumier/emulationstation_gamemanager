# Nginx configuration for GameManager Application
# Place this file in /etc/nginx/sites-available/ or /etc/nginx/conf.d/

server {
    listen 80;
    server_name gamemanager.local;  # Change to your domain or IP
    
    # Optional: Redirect HTTP to HTTPS (uncomment after setting up SSL)
    # return 301 https://$server_name$request_uri;

    # Logging
    access_log /var/log/nginx/gamemanager_access.log;
    error_log /var/log/nginx/gamemanager_error.log;

    # Maximum file upload size (for ROMs and media files)
    client_max_body_size 500M;

    # Timeout settings for large downloads
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    location / {
        proxy_pass http://127.0.0.1:5000;  # GameManager runs on port 5000 by default
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (for real-time updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Disable buffering for streaming downloads
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Serve static files directly (CSS, JS, images)
    location /static/ {
        alias /opt/gamemanager/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve ROM media files directly (bypasses Flask, much faster)
    location /roms/ {
        alias /opt/gamemanager/roms/;
        # Cache on client side but don't force expiration (allow revalidation)
        add_header Cache-Control "public, must-revalidate";
        # Use ETag for cache validation
        etag on;
        
        # Enable directory listing for debugging (optional, disable in production)
        # autoindex on;
    }

    # Optional: Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

