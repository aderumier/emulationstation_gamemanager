<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG Grid AutoHeaderHeight Test</title>
    
    <!-- AG Grid CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.1/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.1/styles/ag-theme-alpine.css">
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        #myGrid {
            height: 500px;
            width: 100%;
        }
        
        /* Allow header text to wrap for autoHeaderHeight to work */
        .ag-theme-alpine .ag-header-cell-label {
            white-space: normal;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>AG Grid AutoHeaderHeight Test</h1>
    <p>This is a minimal test page to verify autoHeaderHeight functionality.</p>
    
    <div id="myGrid" class="ag-theme-alpine"></div>
    
    <!-- AG Grid JS -->
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.1/dist/ag-grid-community.min.js"></script>
    
    <script>
        // Sample data
        const rowData = [
            { make: 'Toyota', model: 'Celica', price: 35000 },
            { make: 'Ford', model: 'Mondeo', price: 32000 },
            { make: 'Porsche', model: 'Boxster', price: 72000 },
            { make: 'BMW', model: 'M3', price: 65000 },
            { make: 'Mercedes', model: 'C-Class', price: 45000 },
        ];
        
        // Column definitions with long header names to test wrapping
        const columnDefs = [
            {
                field: 'make',
                headerName: 'Car Manufacturer Company Name',
                wrapHeaderText: true,
                autoHeaderHeight: true,
            },
            {
                field: 'model',
                headerName: 'Vehicle Model Type and Specification',
                wrapHeaderText: true,
                autoHeaderHeight: true,
            },
            {
                field: 'price',
                headerName: 'Price in US Dollars',
                wrapHeaderText: true,
                autoHeaderHeight: true,
            },
        ];
        
        // Grid options
        const gridOptions = {
            columnDefs: columnDefs,
            rowData: rowData,
            autoHeaderHeight: true,
            defaultColDef: {
                sortable: true,
                filter: true,
                resizable: true,
                wrapHeaderText: true,
            },
        };
        
        // Create the grid
        const gridDiv = document.querySelector('#myGrid');
        const gridApi = agGrid.createGrid(gridDiv, gridOptions);
        
        console.log('Grid created with autoHeaderHeight:', gridOptions.autoHeaderHeight);
    </script>
</body>
</html>
